<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>SCZ-Architecture logo</title>
  <!-- background badge -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="#0D47A1"/>
  <!-- data / address / control buses -->
  <g stroke-width="14" stroke-linecap="round" fill="none">
    <path d="M60 196 H140" stroke="#90CAF9"/>
    <path d="M60 256 H140" stroke="#F48FB1"/>
    <path d="M60 316 H140" stroke="#FFCC80"/>
    <path d="M372 196 H452" stroke="#90CAF9"/>
    <path d="M372 256 H452" stroke="#F48FB1"/>
    <path d="M372 316 H452" stroke="#FFCC80"/>
  </g>
  <!-- chip pins -->
  <g fill="#FFD54F">
    <rect x="178" y="92" width="18" height="48" rx="4"/>
    <rect x="222" y="92" width="18" height="48" rx="4"/>
    <rect x="272" y="92" width="18" height="48" rx="4"/>
    <rect x="316" y="92" width="18" height="48" rx="4"/>
    <rect x="178" y="372" width="18" height="48" rx="4"/>
    <rect x="222" y="372" width="18" height="48" rx="4"/>
    <rect x="272" y="372" width="18" height="48" rx="4"/>
    <rect x="316" y="372" width="18" height="48" rx="4"/>
  </g>
  <!-- chip body -->
  <rect x="140" y="136" width="232" height="240" rx="28" fill="#263238" stroke="#FFD54F" stroke-width="10"/>
  <!-- 8 data bits -->
  <g fill="#69F0AE">
    <rect x="168" y="168" width="16" height="16" rx="3"/>
    <rect x="190" y="168" width="16" height="16" rx="3" opacity="0.35"/>
    <rect x="212" y="168" width="16" height="16" rx="3"/>
    <rect x="234" y="168" width="16" height="16" rx="3"/>
    <rect x="262" y="168" width="16" height="16" rx="3" opacity="0.35"/>
    <rect x="284" y="168" width="16" height="16" rx="3"/>
    <rect x="306" y="168" width="16" height="16" rx="3" opacity="0.35"/>
    <rect x="328" y="168" width="16" height="16" rx="3"/>
  </g>
  <text x="256" y="290" text-anchor="middle" font-family="DejaVu Sans, Arial, Helvetica, sans-serif"
        font-size="82" font-weight="bold" fill="#FFFFFF" letter-spacing="2">SCZ</text>
  <text x="256" y="336" text-anchor="middle" font-family="DejaVu Sans Mono, Courier New, monospace"
        font-size="24" font-weight="bold" fill="#FFD54F" letter-spacing="3">8-BIT CPU</text>
  <text x="256" y="468" text-anchor="middle" font-family="DejaVu Sans, Arial, Helvetica, sans-serif"
        font-size="30" font-weight="bold" fill="#E3F2FD" letter-spacing="4">ARCHITECTURE</text>
</svg>
